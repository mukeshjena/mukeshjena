# ═══════════════════════════════════════════════════════════════════════════
# 📰 Update README with Recent GitHub Activity
# ═══════════════════════════════════════════════════════════════════════════
# Fetches recent commits across your repos and injects a formatted
# activity feed into README.md between the RECENT_ACTIVITY markers.
#
# Runs: Every 30 minutes + manual trigger
# Markers: <!--RECENT_ACTIVITY:start--> / <!--RECENT_ACTIVITY:end-->
# ═══════════════════════════════════════════════════════════════════════════

name: Update README Activity

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "*/5 * * * *"   # Every 5 minutes
  workflow_dispatch:          # Manual trigger

jobs:
  update-activity:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README with recent activity
        uses: actions/github-script@v7
        env:
          GH_USERNAME: mukeshjena
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const username = process.env.GH_USERNAME;

            const activityLines = [];
            const maxLines = 10;
            const seenItems = new Set();

            try {
              // ── Fetch recently updated repos ──────────────────────────
              const reposResponse = await github.rest.repos.listForUser({
                username: username,
                sort: 'updated',
                per_page: 15,
                type: 'owner'
              });

              const repos = reposResponse.data || [];

              // ── Gather recent commits from each repo ──────────────────
              for (const repo of repos) {
                if (activityLines.length >= maxLines) break;

                try {
                  const commitsResponse = await github.rest.repos.listCommits({
                    owner: username,
                    repo: repo.name,
                    author: username,
                    per_page: 3
                  });

                  const commits = commitsResponse.data || [];

                  for (const commit of commits) {
                    if (activityLines.length >= maxLines) break;

                    const sha = commit.sha.substring(0, 7);
                    const key = `${repo.name}-${sha}`;

                    if (seenItems.has(key)) continue;
                    seenItems.add(key);

                    const message = commit.commit.message.split('\n')[0];
                    // Truncate long messages
                    const truncatedMsg = message.length > 60
                      ? message.substring(0, 57) + '...'
                      : message;

                    const date = new Date(commit.commit.author.date);
                    const dateStr = date.toLocaleDateString('en-US', {
                      month: 'short',
                      day: 'numeric'
                    });

                    activityLines.push(
                      `| 🔨 | [${repo.name}](https://github.com/${username}/${repo.name}) | \`${truncatedMsg}\` | ${dateStr} |`
                    );
                  }
                } catch (repoError) {
                  // Skip repos where we can't fetch commits (e.g. forks)
                  console.log(`Skipping ${repo.name}: ${repoError.message}`);
                  continue;
                }
              }

              // ── Build the activity table ──────────────────────────────
              let activityContent;

              if (activityLines.length === 0) {
                activityContent = '\n*🔄 No recent activity found. Check back soon!*\n';
              } else {
                const tableHeader = [
                  '',
                  '| 🔹 | Repository | Commit | Date |',
                  '|:--:|:-----------|:-------|:----:|'
                ].join('\n');

                activityContent = '\n' + tableHeader + '\n' + activityLines.join('\n') + '\n';
              }

              // ── Read and update README.md ─────────────────────────────
              const readmePath = 'README.md';

              if (!fs.existsSync(readmePath)) {
                console.log('README.md not found, skipping update.');
                return;
              }

              const readme = fs.readFileSync(readmePath, 'utf8');

              const startMarker = '<!--RECENT_ACTIVITY:start-->';
              const endMarker = '<!--RECENT_ACTIVITY:end-->';

              const startIdx = readme.indexOf(startMarker);
              const endIdx = readme.indexOf(endMarker);

              if (startIdx === -1 || endIdx === -1) {
                console.log('Activity markers not found in README.md, skipping.');
                return;
              }

              const before = readme.substring(0, startIdx + startMarker.length);
              const after = readme.substring(endIdx);

              const newReadme = before + activityContent + after;

              // ── Only write if content actually changed ────────────────
              if (newReadme === readme) {
                console.log('No changes detected, skipping commit.');
                return;
              }

              fs.writeFileSync(readmePath, newReadme, 'utf8');
              console.log('README.md updated with recent activity.');

            } catch (error) {
              console.error('Error updating activity:', error.message);
              core.setFailed(error.message);
            }

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update recent activity [skip ci]"
          git push
