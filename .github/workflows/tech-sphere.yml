name: Generate Tech Stack Sphere

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/generate_sphere.py'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Generate Sphere SVG
        run: python .github/scripts/generate_sphere.py
        
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tech-stack-sphere.svg
          git commit -m "chore: update tech stack sphere" || exit 0
          git push
